services:
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: drivehub
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d drivehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-change_me_in_production}@db:5432/drivehub
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "4173:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
