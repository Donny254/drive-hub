services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wheelsnationke
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - drive-hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wheelsnationke"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wheelsnationke
      JWT_SECRET: local-docker-change-me
      CORS_ORIGIN: http://localhost:4173
      FRONTEND_URL: http://localhost:4173
      PGSSL: "false"
    volumes:
      - drive-hub-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "4173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  drive-hub-postgres:
  drive-hub-uploads:
