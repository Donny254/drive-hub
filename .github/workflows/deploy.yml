
name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, wheelsnation]
    environment: production
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify deployment tools
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          git --version
          docker --version
          docker compose version

      - name: Deploy application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${VITE_API_BASE_URL}" ]]; then
            echo "Missing production secret: VITE_API_BASE_URL" >&2
            exit 1
          fi

          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
