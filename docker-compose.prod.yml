services:
  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - drive-hub-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL for production builds}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  drive-hub-uploads:
